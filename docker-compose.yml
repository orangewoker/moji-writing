name: moji-writing

services:
  moji-writing-workbench:
    image: ghcr.io/orangewoker/moji-writing:0.1.19
    container_name: moji-writing-workbench
    user: "0:0"
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      MOJI_DATA_DIR: /data
      PORT: 8080
    volumes:
      - ./moji-data:/data
